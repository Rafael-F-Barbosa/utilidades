<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline BB - Visao Global</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <svg class="icone" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
    <path d="M1.5 3.25A2.25 2.25 0 0 1 3.75 1h8.5A2.25 2.25 0 0 1 14.5 3.25v8.5a2.25 2.25 0 0 1-2.25 2.25h-8.5a2.25 2.25 0 0 1-2.25-2.25v-8.5ZM4.25 4a.75.75 0 0 0 0 1.5h7.5a.75.75 0 0 0 0-1.5h-7.5ZM4 7.75a.75.75 0 0 1 .75-.75h3.5a.75.75 0 0 1 0 1.5h-3.5a.75.75 0 0 1-.75-.75Zm.75 1.75a.75.75 0 0 0 0 1.5h1.5a.75.75 0 0 0 0-1.5h-1.5Z"></path>
  </svg>
  <h1>Pipeline BB <small>release de software e dados &middot; ultimos 7 dias</small></h1>
  <div class="saude-geral">
    <span class="gauge-rotulo">Saude do sistema</span>
    <div class="gauge" id="gauge"><span>0</span></div>
  </div>
</header>

<main>
  <div class="pipeline" id="pipeline"></div>
</main>

<footer class="legenda" id="legenda"></footer>

<style>
  .bloco b { font-size: 15px; font-weight: 600; }
</style>

<script src="dados.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  function abrirJob(nome) {
    window.location.href = "job.html?nome=" + encodeURIComponent(nome);
  }

  function corCelula(r) {
    if (r.total === 0) return "#afb8c1";
    if (r.taxa >= 80) return "#2da44e";
    if (r.taxa >= 55) return "#bf8700";
    return "#cf222e";
  }

  var pipeline = document.getElementById("pipeline");
  var etaps = ["builds", "releases", "execucoes"];

  var grade = document.createElement("div");
  grade.className = "pgrade cabecalho";
  grade.innerHTML =
    '<div class="cel-nome">Job</div>' +
    etaps.map(function (c) {
      return '<div class="cel-etapa">' + TITULO_ETAPA[c] + "<small>" + resumoGeralEtapa(c).total + " no total</small></div>";
    }).join("");
  pipeline.appendChild(grade);

  var nomes = DADOS.builds.map(function (j) { return j.nome; });

  nomes.forEach(function (nome) {
    var saude = saudeJob(nome);
    var linha = document.createElement("div");
    linha.className = "pgrade";

    var nomeCel = document.createElement("div");
    nomeCel.className = "cel-nome";
    nomeCel.innerHTML = '<span class="job-link">' + esc(nome) + "</span>" + labelSaude(saude);
    nomeCel.addEventListener("click", function () { abrirJob(nome); });
    linha.appendChild(nomeCel);

    etaps.forEach(function (c) {
      var r = resumoEtapa(c, nome);
      var cel = document.createElement("div");
      cel.className = "cel-dados";
      cel.innerHTML =
        '<div class="bloco" style="background:' + corCelula(r) + '"><b>' + r.total + "</b>" +
        "<small>" + r.bons + " ok &middot; " + r.ruins + " ruim</small></div>";
      cel.addEventListener("click", function () { abrirJob(nome); });
      cel.addEventListener("mouseenter", function (ev) {
        mostrarDica(ev, "<b>" + esc(nome) + "</b> &middot; " + TITULO_ETAPA[c] +
          "<br>Total: " + r.total + "<br>OK: " + r.bons + " &middot; Ruim: " + r.ruins + " &middot; Outros: " + r.outros +
          "<br><i>Clique para ver o caminho dos dados</i>");
      });
      cel.addEventListener("mousemove", function (ev) {
        mostrarDica(ev, "<b>" + esc(nome) + "</b> &middot; " + TITULO_ETAPA[c] +
          "<br>Total: " + r.total + "<br>OK: " + r.bons + " &middot; Ruim: " + r.ruins + " &middot; Outros: " + r.outros +
          "<br><i>Clique para ver o caminho dos dados</i>");
      });
      cel.addEventListener("mouseleave", esconderDica);
      linha.appendChild(cel);
    });

    pipeline.appendChild(linha);
  });

  var sg = saudeGeral();
  var g = document.getElementById("gauge");
  g.style.setProperty("--gcor", corPorSaude(sg));
  g.querySelector("span").textContent = sg;

  document.getElementById("legenda").innerHTML =
    "<span class='item'><span class='dot' style='background:#2da44e'></span>OK (&gt;=80% de sucesso)</span>" +
    "<span class='item'><span class='dot' style='background:#bf8700'></span>Instavel (55-79%)</span>" +
    "<span class='item'><span class='dot' style='background:#cf222e'></span>Ruim (&lt;55%)</span>" +
    "<span class='item'>Clique em um job para ver o caminho dos dados (build &rarr; release &rarr; execucoes).</span>";
})();
</script>
</body>
</html>
