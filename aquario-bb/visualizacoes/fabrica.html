<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline BB - 02 Planta Industrial</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <a class="voltar" href="index.html">&larr; Visualizacoes</a>
  <h1>02 &middot; Planta Industrial <small>Mapa da fabrica de release: setores ligados por esteiras</small></h1>
  <div class="saude-geral">
    <span class="gauge-rotulo">Saude do sistema</span>
    <div class="gauge" id="gauge"><span>0</span></div>
  </div>
</header>

<main>
  <div class="fabrica" id="fabrica">
    <div class="salas">
      <div class="sala" data-cat="builds"></div>
      <div class="sala" data-cat="releases"></div>
      <div class="sala" data-cat="execucoes"></div>
    </div>
    <div class="esteira" id="esteira">
      <div class="pista"></div>
      <div class="rolos" id="rolos"></div>
    </div>
  </div>
</main>

<footer class="legenda" id="legenda"></footer>

<style>
  .fabrica {
    position: relative; margin: 18px 24px; overflow: hidden;
    height: calc(100vh - 165px); min-height: 480px; border-radius: 18px;
    background: linear-gradient(180deg, #2a3642, #33424f 60%, #3d4e5d);
    box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.35), 0 12px 30px rgba(0, 0, 0, 0.4);
  }
  .chao { position: absolute; left: 0; right: 0; bottom: 0; height: 58%; background: linear-gradient(180deg, #46586a, #39485a); }
  .salas { position: relative; z-index: 3; display: flex; justify-content: space-around; padding: 26px 2% 0; }
  .sala {
    position: relative; width: 29%; min-height: 235px;
    background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px; padding: 16px; cursor: pointer;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
    transition: border-color .15s, transform .15s;
  }
  .sala:hover { border-color: var(--suave); transform: translateY(-2px); }
  .sala::before {
    content: ""; position: absolute; top: -15px; left: 8%; right: 8%; height: 17px;
    background: #5b6b7b; border-radius: 4px 4px 0 0;
    clip-path: polygon(6% 0, 94% 0, 100% 100%, 0 100%);
  }
  .sala .titulo { font-weight: 800; font-size: 16px; margin-bottom: 10px; letter-spacing: .3px; }
  .sala .num-grande { font-size: 30px; font-weight: 800; line-height: 1; }
  .sala .contagens { font-size: 12px; color: var(--suave); margin: 8px 0 10px; }
  .sala .contagens b.ok { color: var(--verde); }
  .sala .contagens b.ruim { color: var(--vermelho); }
  .sala .placa {
    display: inline-block; margin-top: 10px; font-size: 11px; font-weight: 700;
    padding: 5px 10px; border-radius: 14px; letter-spacing: .3px;
  }
  .esteira {
    position: absolute; left: 2%; right: 2%; bottom: 40px; height: 66px; z-index: 5;
    background: #2a3540; border-radius: 34px; border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
  }
  .pista {
    position: absolute; left: 18px; right: 18px; top: 14px; height: 10px;
    background: repeating-linear-gradient(90deg, #55626f 0 18px, #3c4752 18px 30px);
    background-size: 30px 100%;
    animation: rolarEsteira 2.2s linear infinite;
    border-radius: 6px;
  }
  @keyframes rolarEsteira { from { background-position: 0 0; } to { background-position: 30px 0; } }
  .rolo {
    position: absolute; top: 26px; width: 14px; height: 14px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #8b98a5, #5a6873);
    border: 1px solid rgba(255, 255, 255, 0.2);
  }
  .lote {
    position: absolute; top: 4px; width: 66px; height: 44px; z-index: 6;
    background: var(--lcor); border-radius: 7px; border: 2px solid rgba(255, 255, 255, 0.7);
    box-shadow: 0 5px 12px rgba(0, 0, 0, 0.45);
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 800; color: #04202e; text-align: center; line-height: 1.15;
    transition: filter .15s;
  }
  .lote:hover { filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6)); }
  .lote small { font-weight: 600; font-size: 9px; opacity: .85; }
  .etiqueta-planta {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 10px; z-index: 4;
    font-size: 11px; color: rgba(255, 255, 255, 0.55); letter-spacing: 2px; text-transform: uppercase;
  }
</style>

<script src="dados.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  var fabrica = document.getElementById("fabrica");
  var chao = document.createElement("div");
  chao.className = "chao";
  fabrica.insertBefore(chao, fabrica.firstChild);

  var etiqueta = document.createElement("div");
  etiqueta.className = "etiqueta-planta";
  etiqueta.textContent = "Planta de Release de Software & Dados";
  fabrica.appendChild(etiqueta);

  var salas = fabrica.querySelectorAll(".sala");
  salas.forEach(function (s) {
    var c = s.getAttribute("data-cat");
    var r = resumoGeralEtapa(c);
    s.innerHTML =
      '<div class="titulo" style="border-left:4px solid ' + COR_ETAPA[c] + ';padding-left:8px">' + TITULO_ETAPA[c] + "</div>" +
      '<div class="num-grande">' + r.total + "</div>" +
      '<div class="contagens"><b class="ok">' + r.bons + " ok</b> &middot; <b class='ruim'>" + r.ruins + " ruim</b>" +
      (r.outros ? " &middot; " + r.outros + " outros" : "") + "</div>" +
      barraPilula(r.bons, r.ruins, r.outros, r.total) +
      '<span class="placa" style="background:' + COR_ETAPA[c] + '">TAXA OK: ' + r.taxa + "%</span>";
    s.addEventListener("mouseenter", function (ev) {
      mostrarDica(ev, "<b>" + TITULO_ETAPA[c] + "</b> (setor da planta)<br>Total: " + r.total +
        "<br>OK: " + r.bons + " &middot; Ruim: " + r.ruins + "<br><i>Clique em um lote da esteira para detalhar o job</i>");
    });
    s.addEventListener("mousemove", function (ev) {
      mostrarDica(ev, "<b>" + TITULO_ETAPA[c] + "</b> (setor da planta)<br>Total: " + r.total +
        "<br>OK: " + r.bons + " &middot; Ruim: " + r.ruins + "<br><i>Clique em um lote da esteira para detalhar o job</i>");
    });
    s.addEventListener("mouseleave", esconderDica);
  });

  var esteira = document.getElementById("esteira");
  var rolos = document.getElementById("rolos");
  var QROLOS = 14;
  for (var i = 0; i < QROLOS; i++) {
    var ro = document.createElement("div");
    ro.className = "rolo";
    ro.style.left = (3 + i * (94 / (QROLOS - 1))) + "%";
    rolos.appendChild(ro);
  }

  var nomes = DADOS.builds.map(function (j) { return j.nome; });
  var lotes = nomes.map(function (nome, i) {
    var saude = saudeJob(nome);
    var cor = corPorSaude(saude);
    var l = document.createElement("div");
    l.className = "lote";
    l.style.setProperty("--lcor", sombrear(cor, 25));
    l.innerHTML = esc(nome.replace("job_", "J")) + "<small>" + saude + "%</small>";
    l.addEventListener("click", function () { abrirModal(nome); });
    l.addEventListener("mouseenter", function (ev) {
      var zona = zonaAtual(l);
      var r = resumoEtapa(zona, nome);
      mostrarDica(ev, "<b>" + esc(nome) + "</b><br>Passando por: <b>" + TITULO_ETAPA[zona] + "</b><br>Saude: " + saude + "%<br>" +
        TITULO_ETAPA[zona] + ": " + r.total + " (" + r.bons + " ok / " + r.ruins + " ruim)<br><i>Clique para detalhar o job</i>");
    });
    l.addEventListener("mousemove", function (ev) {
      var zona = zonaAtual(l);
      var r = resumoEtapa(zona, nome);
      mostrarDica(ev, "<b>" + esc(nome) + "</b><br>Passando por: <b>" + TITULO_ETAPA[zona] + "</b><br>Saude: " + saude + "%<br>" +
        TITULO_ETAPA[zona] + ": " + r.total + " (" + r.bons + " ok / " + r.ruins + " ruim)<br><i>Clique para detalhar o job</i>");
    });
    l.addEventListener("mouseleave", esconderDica);
    esteira.appendChild(l);
    return { el: l, nome: nome, saude: saude, fase: (i / nomes.length) * 100, vel: 2.2 + (i % 4) * 0.35 };
  });

  function zonaAtual(loteEl) {
    var pct = parseFloat(loteEl.style.left) || 0;
    return pct < 33.3 ? "builds" : pct < 66.6 ? "releases" : "execucoes";
  }

  var t0 = performance.now();
  function loop(agora) {
    var t = (agora - t0) / 1000;
    lotes.forEach(function (l) {
      var x = (l.fase + t * l.vel) % 100;
      l.el.style.left = x + "%";
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  var sg = saudeGeral();
  var g = document.getElementById("gauge");
  g.style.setProperty("--v", sg);
  g.style.setProperty("--gcor", corPorSaude(sg));
  g.querySelector("span").textContent = sg;

  document.getElementById("legenda").innerHTML =
    "<span class='item'>Lotes na esteira = jobs em fluxo (cor = saude do job).</span>" +
    "<span class='item'>Setores = etapas do processo (Build, Liberacao, Execucao).</span>" +
    "<span class='item'>Clique em um lote para detalhar o job.</span>";
})();
</script>
</body>
</html>
