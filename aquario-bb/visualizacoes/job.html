<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pipeline BB - Caminho dos Dados</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>
<header class="topo">
  <a class="voltar" href="index.html">&larr; Pipeline Global</a>
  <h1 id="titulo-job">Job</h1>
  <div class="seletor-job">
    <label for="sel-job">Job</label>
    <select id="sel-job"></select>
  </div>
  <div class="saude-geral">
    <span class="gauge-rotulo">Saude do job</span>
    <div class="gauge" id="gauge"><span>0</span></div>
  </div>
</header>

<main>
  <section class="resumo-job" id="resumo"></section>
  <section class="caminho">
    <h2>Caminho dos dados &middot; versoes fechadas</h2>
    <p class="subcaminho">Para cada versao fechada com sucesso (build &rarr; release), as execucoes relacionadas com percentual de sucessos e falhas.</p>
    <div class="fluxos" id="fluxos"></div>
  </section>
</main>

<style>
  #titulo-job small { display: block; font-weight: 400; color: var(--texto-sec); font-size: 12px; }
</style>

<script src="dados.js"></script>
<script src="comum.js"></script>
<script>
(function () {
  var qs = new URLSearchParams(window.location.search);
  var atual = qs.get("nome") || (DADOS.builds[0] || {}).nome;

  var nomes = DADOS.builds.map(function (j) { return j.nome; });
  var sel = document.getElementById("sel-job");
  nomes.forEach(function (n) {
    var o = document.createElement("option");
    o.value = n;
    o.textContent = n;
    if (n === atual) o.selected = true;
    sel.appendChild(o);
  });
  sel.addEventListener("change", function () {
    window.location.href = "job.html?nome=" + encodeURIComponent(sel.value);
  });

  function pizzaHtml(ok, falha) {
    var total = ok + falha;
    if (total === 0) return '<div class="pizza pizza-vazia"><span class="pct">0%</span></div>';
    var okPct = Math.round(ok / total * 100);
    return '<div class="pizza" style="background:conic-gradient(#2da44e 0 ' + okPct + '%, #cf222e ' + okPct + '% 100%)">' +
      '<span class="pct">' + okPct + "%</span></div>";
  }

  function render() {
    var builds = artefatosDe("builds", atual);
    var rels = artefatosDe("releases", atual);
    var execs = artefatosDe("execucoes", atual);
    var buildsMap = {};
    builds.forEach(function (b) { buildsMap[b.id_build] = b; });

    var saude = saudeJob(atual);
    var est = estadoSaude(saude);
    document.getElementById("titulo-job").innerHTML =
      esc(atual) + " " + labelSaude(saude) + "<small>caminho dos dados</small>";
    var g = document.getElementById("gauge");
    g.style.setProperty("--gcor", est.cor);
    g.querySelector("span").textContent = saude;

    var rb = resumoEtapa("builds", atual);
    var re = resumoEtapa("execucoes", atual);
    var fechadas = rels.filter(function (r) { return r.status === "AGENDADO" || r.status === "ARQUIVADO"; });

    var resumo = document.getElementById("resumo");
    resumo.innerHTML = "";

    var cBuild = document.createElement("div");
    cBuild.className = "cartao-resumo";
    cBuild.style.setProperty("--ecor", COR_ETAPA.builds);
    cBuild.innerHTML = '<div class="tit">Builds</div><div class="corpo">' +
      '<span class="nums" style="font-size:26px;font-weight:600;color:var(--texto)">' + rb.total + "</span>" +
      '<span class="nums"><b class="ok">' + rb.bons + " ok</b><br><b class='ruim'>" + rb.ruins + " falha</b></span></div>";
    resumo.appendChild(cBuild);

    var cRel = document.createElement("div");
    cRel.className = "cartao-resumo";
    cRel.style.setProperty("--ecor", COR_ETAPA.releases);
    cRel.innerHTML = '<div class="tit">Releases fechadas</div><div class="corpo">' +
      '<span class="nums" style="font-size:26px;font-weight:600;color:var(--texto)">' + fechadas.length + "</span>" +
      '<span class="nums">de ' + rels.length + " releases<br>versoes com execucao</span></div>";
    resumo.appendChild(cRel);

    var cExec = document.createElement("div");
    cExec.className = "cartao-resumo";
    cExec.style.setProperty("--ecor", COR_ETAPA.execucoes);
    cExec.innerHTML = '<div class="tit">Execucoes</div><div class="corpo">' +
      pizzaHtml(re.bons, re.ruins) +
      '<span class="nums"><b class="ok">' + re.bons + " sucesso</b><br><b class='ruim'>" + re.ruins + " falha</b><br>" + re.total + " total</span></div>";
    resumo.appendChild(cExec);

    var fluxos = document.getElementById("fluxos");
    fluxos.innerHTML = "";

    fechadas.forEach(function (rel) {
      var b = buildsMap[rel.id_build];
      var exs = execs.filter(function (e) { return e.id_release === rel.id_release; });
      var ok = exs.filter(function (e) { return e.status === "SUCESSO"; }).length;
      var falha = exs.filter(function (e) { return e.status === "FALHA"; }).length;

      var fx = document.createElement("div");
      fx.className = "fluxo";
      fx.innerHTML =
        '<div class="no" style="--ncor:' + COR_ETAPA.builds + '">' +
          '<div class="no-cab">Build</div>' +
          '<div class="versao">' + esc(b ? b.versao : rel.versao) + "</div>" +
          '<div class="det">#' + (b ? b.id_build : "-") + " " + (b ? badge(b.status) : "") + "</div>" +
          '<div class="data">fim ' + fmtData(b ? b.data_fim : null) + "</div>" +
        "</div>" +
        '<div class="seta">&#10148;</div>' +
        '<div class="no" style="--ncor:' + COR_ETAPA.releases + '">' +
          '<div class="no-cab">Release</div>' +
          '<div class="versao">' + esc(rel.versao) + "</div>" +
          '<div class="det">#' + rel.id_release + " " + badge(rel.status) + "</div>" +
          '<div class="data">aprovacao ' + fmtData(rel.data_aprovacao) + "</div>" +
        "</div>" +
        '<div class="seta">&#10148;</div>' +
        '<div class="no" style="--ncor:' + COR_ETAPA.execucoes + '">' +
          '<div class="no-cab">Execucoes (' + exs.length + ")</div>" +
          '<div class="corpo" style="display:flex;align-items:center;gap:14px">' +
            pizzaHtml(ok, falha) +
            '<div class="legenda-pizza"><b class="ok">' + ok + " sucesso</b><br><b class='ruim'>" + falha + " falha</b></div>" +
          "</div>" +
        "</div>";
      fluxos.appendChild(fx);
    });

    if (!fechadas.length) {
      fluxos.innerHTML = '<div class="sem-dados">Nenhuma versao fechada encontrada para este job.</div>';
    }
  }

  render();
})();
</script>
</body>
</html>
